name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller
      - name: Build executables
        run: python build.py
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows-package | Out-Null
          Copy-Item docs\QUICK_START_WINDOWS.md dist\windows-package\0-先看我.md
          Copy-Item dist\net-egress-switcher-gui.exe dist\windows-package\1-点我启动-网络出口切换.exe
          Copy-Item dist\net-egress-switcher-cli.exe dist\windows-package\9-命令行-egress-switcher.exe
          Copy-Item docs\HARDWARE_CHECKLIST.md dist\windows-package\真机验收清单.md
          Compress-Archive -Path dist\windows-package\* -DestinationPath dist\net-egress-switcher-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/net-egress-switcher-windows.zip

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-pip python3-venv python3-full
          bash scripts/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/*.deb
            dist/*.sha256

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: apple-silicon
          - runner: macos-15-intel
            architecture: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller
          python -c "import tkinter; print(tkinter.TkVersion)"
      - name: Build app
        run: bash scripts/macos/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}-release
          path: |
            dist/net-egress-switcher-macos-${{ matrix.architecture }}.dmg
            dist/net-egress-switcher-macos-${{ matrix.architecture }}.dmg.sha256
            dist/net-egress-switcher-macos-${{ matrix.architecture }}.zip
            dist/net-egress-switcher-macos-${{ matrix.architecture }}.zip.sha256

  publish:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/net-egress-switcher-windows.zip
            dist/*.deb
            dist/*.dmg
            dist/net-egress-switcher-macos-*.zip
            dist/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
